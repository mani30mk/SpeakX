services:
  - type: web
    name: speakx
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node db/init.js && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-live-preview
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
